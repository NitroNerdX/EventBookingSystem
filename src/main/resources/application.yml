spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: when-authorized
    metrics:
      tags:
        application: event-booking-system